name: CI — Tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master, 'feature/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────
  # Backend — pytest (Django + SQLite)
  # ───────────────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (for ast-parser tests)
        working-directory: frontend
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config default-libmysqlclient-dev ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --no-input

      - name: Run pytest with coverage
        run: pytest -v --tb=short --junitxml=pytest-results.xml --cov=base_feature_app --cov-branch --cov-report=json:coverage-backend.json --cov-report=xml:coverage-backend.xml

      - name: Backend coverage summary
        if: always()
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/backend-job-summary.py" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: |
            backend/coverage-backend.json
            backend/pytest-results.xml
          retention-days: 5

  # ───────────────────────────────────────────
  # Backend — row-locking regressions on an isolated MySQL service
  # ───────────────────────────────────────────
  mysql-concurrency-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DB_ENGINE: django.db.backends.mysql
      DB_NAME: mimittos_ci
      DB_USER: root
      DB_PASSWORD: ci-disposable-password
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      BACKUPS_ENABLED: 'false'
      ENABLE_SLOW_QUERIES_REPORT: 'false'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: mimittos_ci
          MYSQL_ROOT_PASSWORD: ci-disposable-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-disposable-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install MySQL build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config default-libmysqlclient-dev
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Verify isolated MySQL connection
        env:
          DJANGO_SETTINGS_MODULE: base_feature_project.settings
        run: |
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          assert connection.vendor == 'mysql', connection.vendor
          connection.ensure_connection()
          PY
      - name: Exercise ten locking scenarios (twelve cases)
        run: |
          timeout 420s pytest --no-cov -v --tb=short --junitxml=mysql-concurrency.xml \
            base_feature_app/tests/commands/test_tasks.py::test_checkout_winning_cleanup_retains_the_personalization \
            base_feature_app/tests/commands/test_tasks.py::test_cleanup_winning_checkout_leaves_no_partial_order \
            base_feature_app/tests/services/test_wompi_service.py::test_concurrent_approvals_have_one_confirmation \
            base_feature_app/tests/views/test_account_code_limits.py::test_concurrent_verification_consumes_one_code \
            base_feature_app/tests/views/test_account_code_limits.py::test_concurrent_requests_create_one_code \
            base_feature_app/tests/views/test_account_code_limits.py::test_concurrent_failures_stop_at_budget \
            base_feature_app/tests/views/test_auth_endpoints.py::test_verify_registration_consumes_code_once_under_mysql_locking \
            base_feature_app/tests/views/test_media_and_content_views.py::test_hero_upload_concurrent_replacements_leave_a_published_file \
            base_feature_app/tests/views/test_order_access_views.py::test_order_access_concurrent_verification_consumes_code_once \
            base_feature_app/tests/views/test_order_access_views.py::test_order_access_concurrent_requests_send_one_code
      - name: Require twelve executed tests without omissions
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('mysql-concurrency.xml').getroot()
          cases = root.findall('.//testcase')
          assert len(cases) == 12, f'Expected 12 cases, found {len(cases)}'
          assert len({(c.get('classname'), c.get('name')) for c in cases}) == 12
          for outcome in ('failure', 'error', 'skipped'):
              assert not root.findall(f'.//{outcome}'), f'Unexpected {outcome}'
          PY
      - name: Upload concurrency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-concurrency
          path: backend/mysql-concurrency.xml
          retention-days: 5

  # ───────────────────────────────────────────
  # Frontend — Jest unit & component tests
  # ───────────────────────────────────────────
  frontend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Run Jest tests with coverage
        run: |
          NODE_OPTIONS='--no-deprecation' npx jest --config jest.config.cjs --coverage --ci --forceExit --json --outputFile=jest-results.json || true
          node scripts/coverage-summary.cjs
          # Fail the step if tests failed
          node -e "const r=require('./jest-results.json'); if(!r.success) process.exit(1);"

      - name: Copy test results alongside coverage
        if: always()
        run: cp jest-results.json coverage/ 2>/dev/null || true

      - name: Frontend unit coverage summary
        if: always()
        run: node "$GITHUB_WORKSPACE/scripts/ci/frontend-job-summary.cjs" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload frontend-unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend-unit
          path: |
            frontend/coverage/coverage-summary.json
            frontend/coverage/jest-results.json
          retention-days: 5

  # ───────────────────────────────────────────
  # Frontend — Playwright E2E tests (2 shards in parallel)
  # ───────────────────────────────────────────
  frontend-e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: E2E (shard ${{ matrix.shard }}/2)
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config default-libmysqlclient-dev ffmpeg

      - name: Create backend venv and install deps
        working-directory: backend
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt

      - name: Run backend migrations
        working-directory: backend
        run: venv/bin/python manage.py migrate --no-input

      - name: Seed E2E test data (offline, deterministic)
        working-directory: backend
        run: venv/bin/python manage.py create_fake_data --peluches 12 --blogs 6 --orders 5 --users 3

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_ORIGIN: http://127.0.0.1:8000
          NEXT_PUBLIC_WOMPI_API_URL: https://sandbox.wompi.co/v1
          NEXT_PUBLIC_WOMPI_PUBLIC_KEY: pub_test_e2e

      - name: Install Playwright browsers with system deps
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests (shard ${{ matrix.shard }}/2)
        run: npx playwright test e2e/ --shard=${{ matrix.shard }}/2 --reporter=blob
        env:
          CI: 'true'
          NEXT_PUBLIC_BACKEND_ORIGIN: http://127.0.0.1:8000

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: frontend/blob-report/
          retention-days: 1

      - name: Upload test traces (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 7

  # ───────────────────────────────────────────
  # E2E Merge Reports — combine blob reports into JSON + flow-coverage
  # ───────────────────────────────────────────
  e2e-merge-reports:
    if: always()
    needs: [frontend-e2e-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-*
          path: frontend/all-blob-reports
          merge-multiple: true
      - name: Merge into JSON + flow-coverage
        run: npx playwright merge-reports --reporter='json,./e2e/reporters/flow-coverage-reporter.mjs' all-blob-reports
        env:
          CI: 'true'
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results/playwright-results.json
      - name: Upload E2E flow coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend-e2e
          path: |
            frontend/e2e-results/flow-coverage.json
            frontend/e2e-results/playwright-results.json
          retention-days: 5

  # ───────────────────────────────────────────
  # Coverage Summary — aggregates all reports
  # ───────────────────────────────────────────
  coverage-summary:
    if: always()
    needs: [backend-tests, frontend-unit-tests, e2e-merge-reports]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: coverage-artifacts/backend
        continue-on-error: true

      - name: Download frontend-unit coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend-unit
          path: coverage-artifacts/frontend-unit
        continue-on-error: true

      - name: Download frontend-e2e coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend-e2e
          path: coverage-artifacts/frontend-e2e
        continue-on-error: true

      - name: Generate coverage summary
        if: always()
        id: summary
        run: node scripts/coverage-summary-ci.cjs

      - name: Write Job Summary
        run: cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report (md)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-md
          path: coverage-report.md
          retention-days: 5

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: coverage-report.md

