name: Hosting document adapter
on:
  pull_request:
    branches: [main, master]
jobs:
  node-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production state consumption
        working-directory: frontend
        run: node --experimental-strip-types --test scripts/hosting/state.test.mjs
