# .testquality.yml - per-project configuration for the test quality gate.
#
# Generated from this project's own gate copy when the canonical core was
# adopted, so behaviour is preserved exactly. Edit freely; the sync script
# never overwrites this file.

backend_app_name: base_feature_app
py_test_file_glob: test_*.py
frontend_unit_dir: "."
frontend_e2e_dir: e2e
max_test_lines: 50
min_test_lines: 3
max_assertions_per_test: 7
max_patches_per_test: 5
min_lines_for_docstring: 15
max_timeout_ms: 100

py_allowed_folders:
  - "commands"
  - "models"
  - "permissions"
  - "serializers"
  - "services"
  - "tasks"
  - "utils"
  - "views"

js_unit_suffixes:
  - ".test.js"
  - ".spec.js"
  - ".test.ts"
  - ".spec.ts"
  - ".test.tsx"
  - ".spec.tsx"

js_e2e_suffixes:
  - ".spec.js"
  - ".spec.ts"

banned_tokens:
  - "batch"
  - "coverage"
  - "cov"
  - "deep"

# Performance budgets use the production compute profile from the fleet toolkit.
performance_paths:
  - "legacy-sales=backend/base_feature_app/views/sale_crud.py"
  - "backoffice-orders=frontend/app/backoffice/pedidos/page.tsx,frontend/lib/services/orderService.ts"
  - "catalog=frontend/app/catalog/page.tsx,frontend/lib/services/peluchService.ts,backend/base_feature_app/views/catalog.py,backend/base_feature_app/serializers/catalog.py"
  - "analytics=backend/base_feature_app/services/analytics_service.py"
  - "reviews=backend/base_feature_app/services/review_service.py"
  - "authentication=frontend/lib/stores/authStore.ts"
  - "orders=backend/base_feature_app/serializers/order.py,backend/base_feature_app/services/order_service.py,backend/base_feature_app/views/order_views.py"
  - "dashboard=backend/base_feature_app/services/analytics_service.py"
performance_budget_tests:
  - "backend/base_feature_app/tests/views/test_sale_detail_queries.py"
  - "frontend/app/backoffice/pedidos/__tests__/page.test.tsx"
  - "frontend/app/catalog/__tests__/page.test.tsx"
  - "backend/base_feature_app/tests/services/test_analytics_service.py"
  - "backend/base_feature_app/tests/services/test_review_service.py"
  - "frontend/lib/stores/__tests__/authStore.test.ts"
  - "backend/base_feature_app/tests/serializers/test_order_serializer.py"
  - "backend/base_feature_app/tests/services/test_order_service.py"
  - "backend/base_feature_app/tests/views/test_order_views.py"
  - "backend/base_feature_app/tests/views/test_catalog_views.py"
